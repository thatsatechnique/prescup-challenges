x-challenge:
  name: "The Crucible"
  icon: TbKey
  summary: >
    Congratulations on making it to the Finals! This challenge will test your offensive
    cryptography skills. Breach the three gates of the Crucible -- Honor, Oblivion, and the
    Champion -- recovering a token from each.
  description: |
    **NICE Work Roles**

    - [Cyberspace Operations](https://niccs.cisa.gov/workforce-development/nice-framework/)
    - [Vulnerability Analysis](https://niccs.cisa.gov/workforce-development/nice-framework/)
    - [Exploitation Analysis](https://niccs.cisa.gov/workforce-development/nice-framework/)

    **NICE Tasks**

    - [T1118](https://niccs.cisa.gov/workforce-development/nice-framework/): Identify vulnerabilities.
    - [T1262](https://niccs.cisa.gov/workforce-development/nice-framework/): Identify programming code flaws.

    ## Background

    Using the skills you've developed from previous challenges and your current work experience, you are tasked with breaching each of the three gates to reach a final challenge.

    ## Getting Started

    Simply log into the provided Kali machine to enter the Crucible. The username is `user` and the password is `password`.

    Investigate any accessible networks in the `10.0.0.0/8` range to discover the gates of Honor, Oblivion, the Phantom and the Champion. The path to victory will reveal itself as you uncover the mysteries of the Crucible.

    **After starting the challenge, you may need to wait up to five minutes for it to fully deploy.** The `challenge.pccc` site will display a `502 Bad Gateway` error until the challenge finishes deploying.

    ## Submission

    There are 3 tokens to retrieve in this challenge. Each token follows the standard `PCCC{...}` format.

    - Token 1: Recover the token in the honorable web directory listing.
    - Token 2: Retrieve the token echoing out of `oblivion`.
    - Token 3: Retrieve the token of champions.

    ## System and Tool Credentials

    |system|operating system|username|password|
    |---|---|---|---|
    |kali-crucible|Kali (Debian)|user|password|

    ## Note

    Attacking or unauthorized access to `challenge.pccc` is forbidden. You may only use the provided web page to view challenge progress and download any challenge artifacts that are provided.
  tags:
    - season:pc6
    - track:offense
    - round:finals
    - role:vulnerability-analysis
    - role:exploitation-analyst
    - topics:cryptography
  variables:
    tokenHonor:
      template: fake.hexify('PCCC{^^^^^^^^^^^^}')
      default: &tokenHonor 'PCCC{0123456789ab}'
    tokenOblivion:
      template: fake.hexify('PCCC{^^^^^^^^^^^^}')
      default: &tokenOblivion 'PCCC{abcdef012345}'
    tokenChampion:
      template: fake.hexify('PCCC{^^^^^^^^^^^^}')
      default: &tokenChampion 'PCCC{fedcba987654}'
  questions:
    - name: "Token 1 - Honor"
      body: "Recover the token in the honorable web directory listing on `honor.pccc`."
      points: 1050
      answer: *tokenHonor
      max_attempts: 100
      placeholder: "PCCC{############}"
    - name: "Token 2 - Oblivion"
      body: "Retrieve the token echoing out of `oblivion.pccc` by intercepting its traffic with `phantom.pccc`."
      points: 1225
      answer: *tokenOblivion
      max_attempts: 100
      placeholder: "PCCC{############}"
    - name: "Token 3 - Champion"
      body: "Repair the corrupted SSH key, log into `champion.pccc`, and retrieve the token of champions."
      points: 1225
      answer: *tokenChampion
      max_attempts: 100
      placeholder: "PCCC{############}"

services:
  honor:
    build:
      context: ./honor
    image: 253388214223.dkr.ecr.us-east-1.amazonaws.com/pc6/c45-finals-the-crucible-honor
    hostname: honor.pccc
    environment:
      tokenHonor: *tokenHonor
    networks:
      - competitor_net
  oblivion:
    build:
      context: ./oblivion
    image: 253388214223.dkr.ecr.us-east-1.amazonaws.com/pc6/c45-finals-the-crucible-oblivion
    hostname: oblivion.pccc
    environment:
      tokenOblivion: *tokenOblivion
    networks:
      - competitor_net
  phantom:
    build:
      context: ./phantom
    image: 253388214223.dkr.ecr.us-east-1.amazonaws.com/pc6/c45-finals-the-crucible-phantom
    hostname: phantom.pccc
    environment:
      tokenOblivion: *tokenOblivion
    networks:
      - competitor_net
  champion:
    build:
      context: ./champion
    image: 253388214223.dkr.ecr.us-east-1.amazonaws.com/pc6/c45-finals-the-crucible-champion
    hostname: champion.pccc
    environment:
      tokenChampion: *tokenChampion
    networks:
      - competitor_net
  challengeserver:
    image: 253388214223.dkr.ecr.us-east-1.amazonaws.com/pc7/challenge-server
    hostname: challenge.pccc
    cap_add:
      - NET_ADMIN
    environment:
      pc_year: "6"
      challenge_name: "The Crucible"
    networks:
      - competitor_net

networks:
  competitor_net:
    internal: true
