# The infra has a very large CPU pool; without a cap nginx spawns one worker per core
# and kills itself. Pin a single worker with a bounded connection count.
worker_processes  1;

events {
    worker_connections  1024;  # cap connections per worker
}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            root /public;
            autoindex on;
        }
    }
}

