x-challenge:
  name: "va_list Adventure"
  icon: TbBug
  summary: >
    Clumsy Coder Cody's C text-adventure game has an exploitable bug. Leak the stack, use it to
    leak the globals, and recover the secret hidden in the program's memory.
  description: |
    **NICE Work Roles**

    - [Exploitation Analysis](https://niccs.cisa.gov/workforce-development/nice-framework/)
    - [Vulnerability Analysis](https://niccs.cisa.gov/workforce-development/nice-framework/)

    **NICE Tasks**

    - [T1359](https://niccs.cisa.gov/workforce-development/nice-framework/): Perform penetration testing.
    - [T1118](https://niccs.cisa.gov/workforce-development/nice-framework/): Identify vulnerabilities.

    ## Background

    Clumsy Coder Cody sent you the following email:

    ```none
    Hey!

    A buddy of mine was able to extract a secret value from a text adventure
    game I'm making in `C`. When I asked how he did it, all he would say was
    "Leak the stack, use that to leak the globals, done, EZPZ".

    I don't understand any of that, and I just want to fix my game.
    Can you help me by recreating his exploit?

    P.S. I put my code on `challenge.pccc` for you to download! You're welcome!

    - Clumsy Coder Cody
    ```

    ## Getting Started

    Log in to the provided Kali VM and access the adventure game using `nc exploit.pccc 31337`. You can download the executable and source code from `challenge.pccc`.

    ## Submission

    There are 3 tokens to retrieve in this challenge. Each token is a 12-character hexadecimal value. Tokens 1 and 2 are retrieved by running a grading check on `challenge.pccc`, while Token 3 will be recovered directly from the vulnerable program's memory.

    - Token 1: Discover the vulnerability on `exploit.pccc` on port `31337` and use it to leak the address of `char playerName[100]` in `main` and enter it in the grader at `challenge.pccc`.
        - The address changes after each run of the game.
    - Token 2: Exploit the game at `exploit.pccc` on port `31337` to leak the address of the global `character player` and enter it in the grader at `challenge.pccc`.
        - The address changes after each run of the game.
    - Token 3: Exploit the game at `exploit.pccc` on port `31337` to retrieve the secret token stored in the `globalStr` global variable. Submit this token directly on this page.

    ## System and Tool Credentials

    |system/tool|username|password|
    |-----------|--------|--------|
    |kali-valist|user|password|

    ## Note

    Attacking or unauthorized access to `challenge.pccc` is forbidden. You may only use the provided web page to view challenge progress and download any challenge artifacts that are provided.
  tags:
    - season:pc6
    - track:offense
    - round:finals
    - role:exploitation-analyst
    - role:vulnerability-analysis
    - topics:reverse-engineering
  variables:
    tokenName:
      template: fake.hexify('PCCC{^^^^^^}')
      default: &tokenName 'PCCC{a1b2c3}'
    tokenPlayer:
      template: fake.hexify('PCCC{^^^^^^}')
      default: &tokenPlayer 'PCCC{f6e5d4}'
    tokenGlobal:
      template: fake.hexify('PCCC{^^^^^^}')
      default: &tokenGlobal 'PCCC{deadbe}'
  questions:
    - name: "Token 1 - playerName address"
      body: "Leak the address of `char playerName[100]` in `main` and enter it in the grader on `challenge.pccc`."
      points: 660
      answer: *tokenName
      max_attempts: 100
      placeholder: "PCCC{######}"
    - name: "Token 2 - player struct address"
      body: "Leak the address of the global `player` struct and enter it in the grader on `challenge.pccc`."
      points: 1320
      answer: *tokenPlayer
      max_attempts: 100
      placeholder: "PCCC{######}"
    - name: "Token 3 - globalStr secret"
      body: "Recover the secret token stored in the `globalStr` global variable directly from the program's memory."
      points: 1320
      answer: *tokenGlobal
      max_attempts: 100
      placeholder: "PCCC{######}"

services:
  exploit:
    build:
      context: ./exploit
    hostname: exploit.pccc
    environment:
      tokenGlobal: *tokenGlobal
    networks:
      - competitor_net
  grader:
    build:
      context: ./grader
    hostname: challenge.pccc
    cap_add:
      - NET_ADMIN
    environment:
      tokenName: *tokenName
      tokenPlayer: *tokenPlayer
      pc_year: "6"
      challenge_name: "va_list Adventure"
    networks:
      - competitor_net

networks:
  competitor_net:
    internal: true
