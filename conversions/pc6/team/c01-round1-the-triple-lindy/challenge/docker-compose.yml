x-challenge:
  name: "The Triple Lindy"
  icon: "TbSwimming"
  description: |
    # The Triple Lindy

    Your team is tasked with performing a penetration test against a local community swimming pool. Find and exploit various web and SCADA/ICS vulnerabilities to ensure the pool's safe operation.

    **NICE Work Roles**

    - [Exploitation Analyst](https://niccs.cisa.gov/workforce-development/nice-framework/)
    - [Cyber Operations](https://niccs.cisa.gov/workforce-development/nice-framework/)

    **NICE Tasks**

    - [T0028](https://niccs.cisa.gov/workforce-development/nice-framework/): Conduct and/or support authorized penetration testing on enterprise network assets.
    - [T0570](https://niccs.cisa.gov/workforce-development/nice-framework/): Apply and utilize authorized cyber capabilities to enable access to targeted networks.
    - [T0591](https://niccs.cisa.gov/workforce-development/nice-framework/): Perform analysis for target infrastructure exploitation activities.

    ## Background

    Use the provided Kali machine to explore and exploit websites and SCADA/ICS systems while gathering data related to the operations of a local swimming pool.

    ## Getting Started

    Log in to the Kali VM and browse to `http://townsville-pool.pccc` to start gathering information about the **Townsville Community Pool** technical operations.

    If you are following along with the solution guide, please note that the domain names now end in `.pccc` rather than `.merch.codes`. 
    The referenced `ctmodbus` program can be installed with `pip install ctmodbus`, then copy and execute the following Python script:
    ```Python
    #!/usr/bin/python3
    # -*- coding: utf-8 -*-
    import re
    import sys
    from ctmodbus.commands import main
    if __name__ == '__main__':
        sys.argv[0] = re.sub(r'(-script\.pyw|\.exe)?$', '', sys.argv[0])
        sys.exit(main())
    ```

    A DNS server is available at dns.pccc for resolving challenge hostnames. Use it with tools like nmap by adding the --dns-servers dns.pccc flag.

    ## Submissions

    There are four (4) tokens to retrieve in this challenge. All tokens become available on the Townsville Community Pool website as they are unlocked by completing the tasks below. You may need to refresh the web page to see the token. Here are some additional details about each token:

    - **Token 1:** Login to the Townsville Community Pool website as the Pool President.
    - **Token 2:** Raise the pool temperature to at least 110 degrees Fahrenheit.
    - **Token 3:** Disable the pool video camera system.
    - **Token 4:** Complete the "Triple Lindy" by changing these three pool water balance values:
        1. Decrease the pH from 7.0 to 6.0.
        2. Increase the chlorine level from 3 ppm to 4 ppm.
        3. Decrease total alkalinity from 100 ppm to 70 ppm.

    ## System and Tool Credentials

    |system/tool|username|password|
    |-----------|--------|--------|
    |kali|user|password|

  summary: |
    Web and SCADA/ICS penetration testing challenge against a simulated community pool system.

  tags:
    - season:pc6
    - track:teams
    - round:1
    - role:exploitation-analyst
    - topics:ics-ot
    - topics:web


  templates:
    token1_flag: &token1_template "fake.bothify('PCCC{login_??_####}', letters='ABCDEF0123456789')"
    token2_flag: &token2_template "fake.bothify('PCCC{temp_??_####}', letters='ABCDEF0123456789')"
    token3_flag: &token3_template "fake.bothify('PCCC{camera_??_####}', letters='ABCDEF0123456789')"
    token4_flag: &token4_template "fake.bothify('PCCC{scada_??_####}', letters='ABCDEF0123456789')"

  variables:

    token1_flag:
      template: *token1_template
      default: &token1_default "PCCC{login_Satisfied}"

    token2_flag:
      template: *token2_template
      default: &token2_default "PCCC{temp_Satisfied}"

    token3_flag:
      template: *token3_template
      default: &token3_default "PCCC{camera_Satisfied}"

    token4_flag:
      template: *token4_template
      default: &token4_default "PCCC{scada_Satisfied}"

  questions:
    - name: "Token 1"
      body: "What is the value of token 1 that is awarded after logging into the Townsville Pool's website as the pool president?"
      placeholder: "PCCC{token_value}"
      points: 280
      answer: *token1_default
      max_attempts: 100

    - name: "Token 2"
      body: "What is the value of token 2, which is awarded after you raise the temperature of the pool to 110 degrees Fahrenheit?"
      placeholder: "PCCC{token_value}"
      points: 350
      answer: *token2_default
      max_attempts: 100

    - name: "Token 3"
      body: "What is the value of token 3, which is awarded after you disable the security cameras on the pool website?"
      placeholder: "PCCC{token_value}"
      points: 350
      answer: *token3_default
      max_attempts: 100

    - name: "Token 4"
      body: "What is the value of token 4, which is awarded after you change the pH, chlorine, and total alkalinity values?"
      placeholder: "PCCC{token_value}"
      points: 420
      answer: *token4_default
      max_attempts: 100

services:
  pool-web:
    build: ./pool_web
    hostname: townsville-pool.pccc
    environment:
      TOKEN1: *token1_default
      TOKEN2: *token2_default
      TOKEN3: *token3_default
      TOKEN4: *token4_default
      POOL_PASSWORD: "Hydrotherapy"
      SEC_API_TOKEN: "A3F7B2E19D4C6A8F0B5E7D2C1A9F4B6E"
      API_IMAGE_URL: "http://secapi.pccc/"
      INTERNAL_API_URL: "http://secapi.pccc/"
      POOL_SCADA_SERVER_IP: "modbus.pccc"
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_PROCESSOR_COUNT: "2"
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    networks:
      - competitor_net


  secapi:
    build: ./secapi
    hostname: secapi.pccc
    environment:
      SEC_API_TOKEN: "A3F7B2E19D4C6A8F0B5E7D2C1A9F4B6E"
      IMAGE_URL: "http://secapi.pccc/StaticFiles/"
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_PROCESSOR_COUNT: "2"
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    networks:
      - competitor_net


  vendor-web:
    build: ./vendor_web
    hostname: apm.pccc
    environment:
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
      DOTNET_PROCESSOR_COUNT: "2"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    networks:
      - competitor_net


  modbus-server:
    build: ./modbus_server
    hostname: modbus.pccc
    networks:
      - competitor_net

  dns:
    build: ./dns
    hostname: dns.pccc
    # DNS is now served by the challenge server (see challengeserver HOSTS_JSON below).
    # This service is retained as a tombstone: its entrypoint.sh just prints a notice
    # and exits (dnsmasq no longer runs). Requires a rebuild of this image.
    networks:
      - competitor_net

  challengeserver:
    build: ../../../../challenge-server
    hostname: challenge.pccc
    cap_add:
      - NET_ADMIN
    environment:
      pc_year: "6"
      challenge_name: "The Triple Lindy"
      # This service (compose name "challengeserver") is the DNS server; must match the
      # HOSTS_JSON self-entry below so genzones resolves it from its own interface IPs.
      CHALLENGE_SELF_NAME: "challengeserver"
      # genzones serves the pccc zone, replacing the old dnsmasq "dns" service.
      # Container names are the compose service names; hostnames are the labels within the zone.
      # The challengeserver self-entry keeps "dns.pccc" resolvable so the challenge
      # description and solution guide (`--dns-servers dns.pccc`) stay valid.
      HOSTS_JSON: >-
        {
          "pccc": [
            { "container": "pool-web",        "hostname": "townsville-pool" },
            { "container": "secapi",          "hostname": "secapi" },
            { "container": "vendor-web",      "hostname": "apm" },
            { "container": "modbus-server",   "hostname": "modbus" },
            { "container": "challengeserver",   "hostname": "challenge", "aliases": ["dns"] }
          ]
        }

    networks:
      - competitor_net

networks:
  competitor_net:
    internal: true
    #external: true #enable if running locally